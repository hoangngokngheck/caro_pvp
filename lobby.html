<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Lobby Caro PvP</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 40px auto; }
    input, button { padding: 8px; margin: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    ul { list-style-type: none; padding: 0; }
    li { margin: 4px 0; }
    .status-idle { color: green; font-weight: bold; }
    .status-match { color: gray; font-style: italic; }
  </style>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <h2>🎮 Lobby Caro PvP</h2>

  <div id="auth">
    <input id="username" placeholder="Nhập tên bất kỳ..." />
    <button onclick="login()">Đăng nhập</button>
    <span id="me"></span>
  </div>

  <div id="actions" style="display:none;">
    <button onclick="createMatch()">Tạo trận mới</button>
    <button onclick="loadMatches()">Tải danh sách trận</button>
    <button onclick="goHistory()">📜 Lịch sử trận đấu</button>

    <h3>Người chơi đang online</h3>
    <ul id="onlineList"></ul>

    <h3>Lời mời đến</h3>
    <ul id="inviteList"></ul>
    <button onclick="declineAll()">Từ chối tất cả</button>
  </div>

  <table id="tbl" style="display:none;">
    <thead><tr><th>ID</th><th>Trạng thái</th><th>Người chơi</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const socket = io();
    let user = null;
    let userId = null;
    let username = null;

    // --- Đăng nhập ---
    async function login() {
      username = document.getElementById("username").value.trim();
      if (!username) return alert("Nhập tên!");

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username }),
      });
      user = await res.json();
      userId = user.id;

      document.getElementById("me").textContent = ` | Xin chào, ${user.username} (id=${user.id})`;
      document.getElementById("actions").style.display = "block";

      socket.emit("user_online", { userId, username });
      loadMatches();
    }

    // --- Tải danh sách trận ---
    async function loadMatches() {
      const res = await fetch("/api/matches");
      const list = await res.json();
      const tbody = document.getElementById("rows");
      tbody.innerHTML = "";
      list.forEach((m) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${m.id}</td>
          <td>${m.status}</td>
          <td>${m.players.join(", ")}</td>
          <td><button onclick="joinMatch(${m.id})">Tham gia</button></td>`;
        tbody.appendChild(tr);
      });
      document.getElementById("tbl").style.display = "table";
    }

    // --- Tạo / tham gia trận ---
    async function createMatch() {
      if (!user) return alert("Đăng nhập trước!");
      const res = await fetch("/api/matches", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: user.id }),
      });
      const { matchId } = await res.json();
      window.location = `/game.html?matchId=${matchId}&userId=${user.id}`;
    }

    async function joinMatch(matchId) {
      if (!user) return alert("Đăng nhập trước!");
      const res = await fetch(`/api/matches/${matchId}/join`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: user.id }),
      });
      const data = await res.json();
      if (data.error) return alert(data.error);
      window.location = `/game.html?matchId=${matchId}&userId=${user.id}`;
    }

    function goHistory() {
      window.location = "/history.html";
    }

    /* ===================== PHẦN MỜI NGƯỜI CHƠI ===================== */

    // Cập nhật danh sách người online
    socket.on("update_online_users", (list) => {
      const onlineList = document.getElementById("onlineList");
      onlineList.innerHTML = "";
      list.forEach((u) => {
        if (u.id != userId) {
          const li = document.createElement("li");
          if (u.status === "in_match") {
            li.innerHTML = `🎮 <span class="status-match">${u.username} – đang trong trận</span>`;
          } else {
            li.innerHTML = `🟢 <span class="status-idle">${u.username}</span> 
              <button onclick="sendInvite(${u.id})">Mời</button>`;
          }
          onlineList.appendChild(li);
        }
      });
    });

    function sendInvite(toId) {
      socket.emit("send_invite", { fromId: userId, toId });
    }

    // Khi có lời mời mới
    socket.on("new_invite", ({ fromId, fromName }) => {
      alert(`📨 Lời mời chơi từ ${fromName}`);
      socket.emit("get_invites", userId);
    });

    // Danh sách lời mời
    socket.on("invite_list", (list) => {
      const inviteList = document.getElementById("inviteList");
      inviteList.innerHTML = "";
      list.forEach((inv) => {
        const li = document.createElement("li");
        li.innerHTML = `${inv.fromName}
          <button onclick="acceptInvite(${inv.fromId})">Chấp nhận</button>
          <button onclick="declineInvite(${inv.fromId})">Từ chối</button>`;
        inviteList.appendChild(li);
      });
    });

    // Khi có lỗi lời mời (offline / đang trong trận)
    socket.on("invite_error", (msg) => {
      alert(`⚠️ ${msg}`);
      socket.emit("get_invites", userId);
    });

    // Khi lời mời được chấp nhận → vào game
    socket.on("invite_accepted", ({ matchId }) => {
      window.location = `/game.html?matchId=${matchId}&userId=${userId}`;
    });

    function acceptInvite(fromId) {
      socket.emit("accept_invite", { userId, fromId });
    }

    function declineInvite(fromId) {
      socket.emit("decline_invite", { userId, fromId });
    }

    function declineAll() {
      socket.emit("decline_all", userId);
    }
  </script>
</body>
</html>
